name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only list the GHCR versions that would be deleted
        type: boolean
        default: true
  schedule:
    # Daily rebuild keeps the GitHub contribution chart fresh
    - cron: "0 9 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

      - name: Upload dist for Docker image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: ./dist
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  image:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist

      - name: Compute tag
        id: tag
        # run_number keeps the tag unique for the daily rebuild of the same commit
        run: echo "tag=${GITHUB_SHA::7}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}

  bump:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      tag: ${{ needs.image.outputs.tag }}
    env:
      GITOPS_REPO: jsundquist/k8s-gitops
    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Pin new image tag and push
        env:
          NEW_TAG: ${{ needs.image.outputs.tag }}
          FILE: apps/blog/kustomization.yaml
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Returns 1 when the file already pins NEW_TAG (nothing to commit)
          pin_and_commit() {
            yq -i '.images[0].newTag = strenv(NEW_TAG)' "$FILE"
            if git diff --quiet; then
              return 1
            fi
            git commit -qam "chore(blog): deploy $NEW_TAG"
          }

          if ! pin_and_commit; then
            echo "$FILE already pins $NEW_TAG, nothing to do"
            exit 0
          fi

          branch=$(git rev-parse --abbrev-ref HEAD)
          attempts=3
          for attempt in $(seq 1 "$attempts"); do
            if git pull --rebase origin "$branch" && git push origin "HEAD:$branch"; then
              exit 0
            fi
            echo "::warning::Push attempt $attempt/$attempts failed"
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" -eq "$attempts" ]; then
              break
            fi
            sleep $((attempt * 5))
            # A rebase conflict means a human edited the same line; start over from upstream
            git fetch -q origin "$branch"
            git reset -q --hard "origin/$branch"
            if ! pin_and_commit; then
              echo "$FILE already pins $NEW_TAG, nothing to do"
              exit 0
            fi
          done
          echo "::error::Could not push $NEW_TAG to $GITOPS_REPO after $attempts attempts; today's deploy was skipped"
          exit 1

  prune:
    needs: bump
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deleting package versions only needs packages: write (the package must also
    # grant this repository Admin under the package's "Manage Actions access")
    permissions:
      packages: write
    env:
      GITOPS_REPO: jsundquist/k8s-gitops
      KEEP: 10
      OWNER: ${{ github.repository_owner }}
      PACKAGE: ${{ github.event.repository.name }}
      NEW_TAG: ${{ needs.bump.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Scheduled/push runs only delete once the repo variable GHCR_PRUNE_ENABLED is 'true';
      # manual runs follow the dry_run input
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.dry_run) || (vars.GHCR_PRUNE_ENABLED == 'true' && 'false' || 'true') }}
    steps:
      - name: Prune old image versions
        run: |
          set -euo pipefail

          # Never delete what the GitOps repo currently pins (covers manual rollbacks too)
          deployed=$(curl -fsSL "https://raw.githubusercontent.com/$GITOPS_REPO/HEAD/apps/blog/kustomization.yaml" | yq '.images[0].newTag')
          if [ -z "$deployed" ] || [ "$deployed" = "null" ]; then
            echo "::error::Could not read the deployed tag from $GITOPS_REPO; refusing to prune"
            exit 1
          fi
          protected=$(jq -nc --arg a "$NEW_TAG" --arg b "$deployed" '[$a, $b]')
          echo "Protected tags: $protected (dry run: $DRY_RUN)"

          gh api --paginate "/users/$OWNER/packages/container/$PACKAGE/versions?per_page=100" | jq -s 'add' > versions.json

          # Keep the newest KEEP tagged versions by creation time. Delete everything (tagged or
          # untagged) older than the KEEP-th one, except protected tags. Untagged versions are
          # the manifests/attestations a tagged image points at, so they are only deleted when
          # created over an hour before the cutoff or before a protected version.
          jq -c --argjson keep "$KEEP" --argjson prot "$protected" --argjson margin 3600 '
            def tags: .metadata.container.tags // [];
            def ts: .created_at | fromdateiso8601;
            sort_by(.created_at) | reverse as $all
            | ($all | map(select(tags | length > 0))) as $tagged
            | if ($tagged | length) <= $keep then empty else
                ($tagged[$keep - 1] | ts) as $cutoff
                | ($all | map(select(tags | any(.[]; IN($prot[])))) | map(ts)) as $pts
                | $all[]
                | . as $v | ts as $s
                | select(
                    $s < $cutoff - $margin
                    and (($v | tags | any(.[]; IN($prot[]))) | not)
                    and (($pts | any(. as $p | $s <= $p and $s >= $p - $margin)) | not)
                  )
                | {id, created_at, tags: ($v | tags)}
              end
          ' versions.json > delete.jsonl

          echo "Total versions: $(jq length versions.json), to delete: $(wc -l < delete.jsonl | tr -d ' ')"
          cat delete.jsonl

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run, nothing deleted"
            exit 0
          fi

          failed=0
          while read -r id; do
            gh api -X DELETE "/users/$OWNER/packages/container/$PACKAGE/versions/$id" || failed=$((failed + 1))
          done < <(jq -r '.id' delete.jsonl)
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed version(s) could not be deleted"
            exit 1
          fi

  token-expiry:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    env:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
      WARN_DAYS: 14
    steps:
      - name: Check GITOPS_TOKEN expiry
        run: |
          set -euo pipefail
          headers=$(mktemp)
          code=$(curl -sS -o /dev/null -D "$headers" -w '%{http_code}' \
            -H "Authorization: Bearer $GITOPS_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/rate_limit)
          if [ "$code" != "200" ]; then
            echo "::error::GITOPS_TOKEN was rejected by the GitHub API (HTTP $code). It has probably expired or been revoked; the daily deploy bump will fail until it is replaced."
            exit 1
          fi

          expiry=$(grep -i '^github-authentication-token-expiration:' "$headers" | cut -d' ' -f2- | tr -d '\r' || true)
          if [ -z "$expiry" ]; then
            echo "::notice::No token expiration header returned; GITOPS_TOKEN does not appear to expire"
            exit 0
          fi

          days=$(( ($(date -u -d "$expiry" +%s) - $(date -u +%s)) / 86400 ))
          if [ "$days" -lt "$WARN_DAYS" ]; then
            echo "::error::GITOPS_TOKEN expires in $days day(s) ($expiry). Create a new fine-grained PAT for jsundquist/k8s-gitops (Contents: read/write) and update the GITOPS_TOKEN secret before then."
            exit 1
          fi
          echo "GITOPS_TOKEN valid for $days more days"
