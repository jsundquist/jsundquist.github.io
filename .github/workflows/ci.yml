name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # Lints the workflow files themselves (syntax, expressions, shellcheck)
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  # Static analysis of the workflows (injection, unpinned actions, excessive permissions).
  # advanced-security is off so the job needs no security-events write permission.
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit workflows
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false

  # Blocks pull requests that introduce dependencies with known high/critical advisories.
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  automerge:
    needs: [validate, actionlint, zizmor, dependency-review]
    # Only PRs *authored* by Dependabot. Uses the PR author, not github.actor,
    # so a human re-running or pushing to a PR can't trigger a merge.
    #
    # What actually gets merged is narrower, see "Decide" below: npm devDependencies,
    # patch/minor only. Everything else (production deps, majors, every github-actions
    # PR) stays open for a human.
    #
    # Caveat: a devDependency is not automatically harmless. For an Astro site much of
    # the "dev" tooling (build plugins, type/lint/format tools run at build time) can
    # still alter the built output. This reduces risk, it is not a guarantee. The
    # 7-day Dependabot cooldown is the main defence for these updates, with the
    # validate/dependency-review/zizmor checks as a second layer.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      # Fails the job if the PR isn't genuinely from Dependabot.
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2

      # Grouped PRs carry several dependencies, so check every entry rather than the
      # single top-level outputs. Fails closed: anything unexpected means no merge.
      - name: Decide
        id: decide
        env:
          UPDATED_DEPENDENCIES: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          set -euo pipefail
          if jq -e '
            length > 0 and all(
              .dependencyType == "direct:development"
              and (.updateType | IN("version-update:semver-patch", "version-update:semver-minor"))
              and (.packageEcosystem | IN("npm", "npm_and_yarn"))
            )
          ' <<< "$UPDATED_DEPENDENCIES" > /dev/null; then
            echo "merge=true" >> "$GITHUB_OUTPUT"
          else
            echo "merge=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not an npm dev-dependency patch/minor update; leaving the PR open for review"
          fi

      - name: Merge
        if: steps.decide.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --squash "$PR_URL"

      # Merges made with GITHUB_TOKEN don't trigger the push event, so deploy.yml
      # would never run. Dispatch it explicitly.
      - name: Deploy
        if: steps.decide.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
