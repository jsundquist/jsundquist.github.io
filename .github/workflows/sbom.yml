name: SBOM
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sbom:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # jsundquist/sbom has no tagged releases yet, so this pins a commit on its main.
      - uses: jsundquist/sbom@38774aeb10a1bc9edf7617a95a4e7fd2ebbee7d3
        with:
          dashboard-url: https://sbom.digital-portfolio.net
          api-token: ${{ secrets.SBOM_DASHBOARD_TOKEN }}
