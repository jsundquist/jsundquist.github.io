# Fail installs/runs on a Node outside package.json engines (see .nvmrc).
engineStrict: true

allowBuilds:
  esbuild: true

# Refuse versions published less than 1 day ago (minutes). Applies to manual
# `pnpm add` and fresh resolution; Dependabot adds its own 7-day cooldown.
minimumReleaseAge: 1440

# Transitive deps Dependabot can't bump itself:
# - @tailwindcss/typography pins postcss-selector-parser to a vulnerable 6.0.10.
# - @emnapi/runtime is an optional peer of @astrojs/check's wasm deps; without
#   this, the resolver picks the 2.0.0-beta.2 prerelease, which breaks
#   `astro check` (bridge.setLastError is not a function).
overrides:
  postcss-selector-parser: ^6.1.5
  '@emnapi/runtime': ^1.11.3
